<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Arabic Document Assistant</title>
  <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root{--ink:#3e3025;--muted:#806d5d;--paper:#fffdf9;--sand:#f4eadb;--linen:#e9d6bf;--clay:#9c6542;--deep:#5b3828;--bubble:#f7efe5;--line:#eadbc9}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 8%,#fff 0 10%,transparent 32%),linear-gradient(135deg,#efe1cf,#f9f4eb 56%,#eadbc7);color:var(--ink);font-family:Tahoma,Arial,sans-serif}
    .shell{width:min(1000px,94vw);min-height:88vh;margin:6vh auto;display:grid;grid-template-columns:270px 1fr;background:rgba(255,253,249,.88);border:1px solid rgba(151,104,70,.22);border-radius:28px;box-shadow:0 26px 70px rgba(83,53,34,.16);overflow:hidden;backdrop-filter:blur(12px)}
    aside{padding:30px 25px;background:linear-gradient(160deg,#6b432f,#3f281e);color:#fff8ef;display:flex;flex-direction:column;gap:24px}.mark{width:45px;height:45px;border-radius:14px;display:grid;place-items:center;background:#d9ae82;color:#4b2d20;font-size:23px;font-weight:bold}.brand{font-size:20px;font-weight:700;line-height:1.5}.brand small{display:block;color:#e9cdb2;font-size:12px;font-weight:400;letter-spacing:.4px}.status{margin-top:auto;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);border-radius:16px;padding:13px;font-size:13px}.dot{display:inline-block;width:8px;height:8px;background:#bfe09a;border-radius:50%;margin-left:7px}.tech{font-size:11px;color:#d9b99c;line-height:1.8}
    .chat{min-width:0;display:flex;flex-direction:column;min-height:88vh}.top{padding:28px 34px 20px;border-bottom:1px solid var(--line);display:flex;align-items:start;justify-content:space-between;gap:15px}.top h1{font-size:22px;margin:0 0 7px}.top p{margin:0;color:var(--muted);font-size:14px}.badge{padding:8px 12px;border-radius:100px;background:#f2e5d5;color:#774b32;font-size:12px;white-space:nowrap}
    .messages{flex:1;overflow:auto;padding:28px 34px;display:flex;flex-direction:column;gap:15px}.welcome{max-width:620px;margin:auto 0;background:linear-gradient(135deg,#fff,#fbf3e9);border:1px solid var(--line);border-radius:20px;padding:25px;box-shadow:0 8px 24px rgba(108,70,42,.06)}.welcome h2{margin:0 0 10px;font-size:21px}.welcome p{margin:0;color:var(--muted);line-height:1.8}.hint{display:inline-block;margin-top:17px;border-radius:9px;background:#efe0ce;color:#68412e;padding:8px 11px;font-size:12px}.message{max-width:82%;padding:14px 16px;border-radius:17px 17px 17px 4px;white-space:pre-wrap;line-height:1.8;background:var(--bubble);border:1px solid #eadbc9}.message.me{align-self:flex-start;background:#6b432f;color:#fffaf4;border-color:#6b432f;border-radius:17px 17px 4px 17px}.error{color:#9b2f24;background:#fff0ec}
    .composer{padding:20px 34px 28px;border-top:1px solid var(--line);background:rgba(255,253,249,.72)}.input-row{display:flex;gap:10px;align-items:center}.input-row input{min-width:0;flex:1;border:1px solid #ddc8b1;background:#fffdf9;border-radius:14px;padding:15px 17px;color:var(--ink);font:inherit;outline:none}.input-row input:focus{border-color:#a77251;box-shadow:0 0 0 3px #f3e5d7}.send{border:0;border-radius:13px;padding:14px 20px;background:var(--deep);color:#fff;cursor:pointer;font:inherit;font-weight:bold;transition:.2s}.send:hover{background:#764932}.send:disabled{opacity:.45;cursor:wait}
    details{margin-top:14px;color:var(--muted);font-size:13px}summary{cursor:pointer;width:max-content;color:#83543a}.upload{display:flex;gap:8px;align-items:center;margin-top:12px}.upload input{max-width:300px;font:inherit}.process{background:transparent;border:1px solid #b78967;border-radius:9px;color:#75472f;padding:8px 12px;cursor:pointer;font:inherit}.process:disabled{opacity:.5}
    :root{--ink:#003f63;--muted:#527087;--paper:#f9fcfc;--sand:#e5f2f2;--linen:#c9e1e2;--clay:#079aa5;--deep:#005681;--bubble:#edf7f7;--line:#cce3e4}
    body{background:radial-gradient(circle at 12% 8%,#fff 0 14%,transparent 38%),linear-gradient(135deg,#f7fbfb,#fff 56%,#f0f8f8)}
    .shell{background:rgba(255,255,255,.9);border-color:rgba(0,86,129,.18);box-shadow:0 26px 70px rgba(0,65,96,.15)}
    aside{padding:28px 25px;background:#dff3f2;color:#004d70;gap:22px}.logo-frame{background:transparent;border-radius:16px;padding:10px}.logo{display:block;width:100%;height:118px;object-fit:contain;mix-blend-mode:multiply}.brand small,.tech{color:#176b82}.status{border-color:#93c9d2;background:rgba(255,255,255,.42)}.badge{background:#dff0ef;color:#006575}.welcome{background:linear-gradient(135deg,#fff,#edf8f8);box-shadow:0 8px 24px rgba(0,86,129,.06)}.hint{background:#dff1f0;color:#006575}.message{background:#edf7f7;border-color:#cce3e4}.message.me{background:#147da6;border-color:#147da6;color:#fff}.table-wrap{overflow-x:auto;margin:4px 0}.answer-table{width:100%;min-width:460px;border-collapse:collapse;text-align:right;background:#fff;border:1px solid #b9d9dc;border-radius:10px;overflow:hidden}.answer-table th{background:#d9efee;color:#005477;font-weight:bold}.answer-table th,.answer-table td{padding:10px;border:1px solid #c7e1e3;vertical-align:top;line-height:1.7}.answer-table td{color:#064c70}.input-row input{border-color:#bcdcdf;background:#fff}.input-row input:focus{border-color:#079aa5;box-shadow:0 0 0 3px #dff2f1}.send{background:#147da6}.send:hover{background:#079aa5}summary{color:#007285}.process{border-color:#0496a2;color:#00647d}
    @media(max-width:700px){.shell{display:block;margin:0;width:100%;min-height:100vh;border-radius:0}aside{display:none}.chat{min-height:100vh}.top,.messages,.composer{padding-right:20px;padding-left:20px}.message{max-width:92%}}
  </style>
</head>
<body><main id="root"></main>
<script type="text/babel">
const {useEffect,useState}=React;
const T={brand:"\u0645\u0633\u0627\u0639\u062f \u0627\u0644\u0648\u062b\u0627\u0626\u0642",sub:"\u0645\u062d\u0627\u062f\u062b\u0629 \u0630\u0643\u064a\u0629 \u0628\u0627\u0644\u0639\u0631\u0628\u064a\u0629",ready:"\u0627\u0644\u0648\u062b\u064a\u0642\u0629 \u0645\u0641\u0647\u0631\u0633\u0629 \u0648\u062c\u0627\u0647\u0632\u0629",title:"\u0627\u0633\u0623\u0644 \u0648\u062b\u064a\u0642\u062a\u0643",desc:"\u062a\u0645\u062a \u0645\u0639\u0627\u0644\u062c\u0629 \u0627\u0644\u0645\u0644\u0641 \u0648\u0641\u0647\u0631\u0633\u062a\u0647 \u0645\u0633\u0628\u0642\u0627\u064b. \u0627\u0643\u062a\u0628 \u0633\u0624\u0627\u0644\u0643 \u0645\u0628\u0627\u0634\u0631\u0629\u060c \u0648\u0633\u064a\u0639\u062a\u0645\u062f \u0627\u0644\u0645\u0633\u0627\u0639\u062f \u0639\u0644\u0649 \u0645\u062d\u062a\u0648\u0627\u0647\u0627 \u0641\u0642\u0637.",hint:"\u0645\u062b\u0627\u0644: \u0645\u0627 \u0623\u0647\u0645 \u0623\u062d\u0643\u0627\u0645 \u0627\u0644\u0648\u062b\u064a\u0642\u0629\u061f",placeholder:"\u0627\u0643\u062a\u0628 \u0633\u0624\u0627\u0644\u0643 \u0628\u0627\u0644\u0639\u0631\u0628\u064a\u0629...",send:"\u0625\u0631\u0633\u0627\u0644",add:"\u0625\u0636\u0627\u0641\u0629 \u0648\u062b\u064a\u0642\u0629 \u062c\u062f\u064a\u062f\u0629",process:"\u0645\u0639\u0627\u0644\u062c\u0629 \u0648\u0641\u0647\u0631\u0633\u0629",processing:"\u062c\u0627\u0631\u064d \u0627\u0644\u0645\u0639\u0627\u0644\u062c\u0629...",added:"\u062a\u0645\u062a \u0625\u0636\u0627\u0641\u0629 \u0627\u0644\u0648\u062b\u064a\u0642\u0629. \u064a\u0645\u0643\u0646\u0643 \u0627\u0644\u0622\u0646 \u0637\u0631\u062d \u0633\u0624\u0627\u0644\u0643.",offline:"\u0644\u0645 \u064a\u062a\u0645 \u0627\u0644\u0639\u062b\u0648\u0631 \u0639\u0644\u0649 \u0648\u062b\u064a\u0642\u0629 \u0645\u0641\u0647\u0631\u0633\u0629."};
const cells=line=>line.trim().replace(/^\||\|$/g,'').split('|').map(x=>x.trim());
function Answer({text}){const lines=text.split('\n'),out=[];for(let i=0;i<lines.length;){if(lines[i].includes('|')&&/^[|:\-\s]+$/.test(lines[i+1]||'')){const header=cells(lines[i]),rows=[];i+=2;while(i<lines.length&&lines[i].includes('|'))rows.push(cells(lines[i++]));out.push(<div className="table-wrap" key={i}><table className="answer-table"><thead><tr>{header.map((x,n)=><th key={n}>{x}</th>)}</tr></thead><tbody>{rows.map((row,n)=><tr key={n}>{row.map((x,c)=><td key={c}>{x}</td>)}</tr>)}</tbody></table></div>)}else{out.push(<React.Fragment key={i}>{lines[i]}{i<lines.length-1&&<br/>}</React.Fragment>);i++}}return <>{out}</>}
function App(){
  const [ready,setReady]=useState(false),[file,setFile]=useState(),[busy,setBusy]=useState(false),[question,setQuestion]=useState(''),[messages,setMessages]=useState([]);
  useEffect(()=>{fetch('/api/status').then(r=>r.json()).then(x=>setReady(x.ready)).catch(()=>setReady(false))},[]);
  async function process(){if(!file)return;setBusy(true);const body=new FormData();body.append('pdf',file);try{const r=await fetch('/api/ingest',{method:'POST',body});const d=await r.json();if(!r.ok)throw Error(d.error);setReady(true);setFile(null);setMessages(m=>[...m,{text:T.added}])}catch(e){setMessages(m=>[...m,{text:e.message,error:true}])}finally{setBusy(false)}}
  async function send(){if(!question.trim()||busy||!ready)return;const text=question.trim(),history=messages.filter(m=>!m.error).slice(-8).map(m=>({role:m.me?'user':'assistant',content:m.text}));setQuestion('');setMessages(m=>[...m,{text,me:true}]);setBusy(true);try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:text,history})});const d=await r.json();if(!r.ok)throw Error(d.error);setMessages(m=>[...m,{text:d.answer.replaceAll('**','').replaceAll('#','')}])}catch(e){setMessages(m=>[...m,{text:e.message,error:true}])}finally{setBusy(false)}}
  return <section className="shell"><aside><div className="logo-frame"><img className="logo" src="/assets/bankruptcy-commission.png" alt="Bankruptcy Commission"/></div><div className="brand">{T.brand}<small>{T.sub}</small></div><div className="status"><span className="dot"/>{ready?T.ready:T.offline}</div><div className="tech">OCI Document Understanding<br/>OCI File Search<br/>GPT-OSS 120B</div></aside><main className="chat"><header className="top"><div><h1>{T.title}</h1><p>{T.sub}</p></div><span className="badge">{ready?"OCI READY":"OCI"}</span></header><div className="messages">{messages.length===0&&<div className="welcome"><h2>{T.title}</h2><p>{T.desc}</p><span className="hint">{T.hint}</span></div>}{messages.map((m,i)=><div key={i} className={'message '+(m.me?'me ':'')+(m.error?'error':'')}><Answer text={m.text}/></div>)}</div><footer className="composer"><div className="input-row"><input disabled={!ready||busy} value={question} onChange={e=>setQuestion(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()} placeholder={T.placeholder}/><button className="send" disabled={!ready||busy} onClick={send}>{busy?"...":T.send}</button></div><details><summary>{T.add}</summary><div className="upload"><input type="file" accept="application/pdf" onChange={e=>setFile(e.target.files[0])}/><button className="process" disabled={!file||busy} onClick={process}>{busy?T.processing:T.process}</button></div></details></footer></main></section>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
